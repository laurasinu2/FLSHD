<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7fa"><title>FLSHD · Deutsch visual</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;color:#243047;background:#f7f7fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:980px;margin:auto;min-height:100vh;padding:22px 18px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.logo{font-weight:900;font-size:25px;letter-spacing:-1px}.logo span{color:#74ba13}.stats{display:flex;gap:10px;font-weight:800;font-size:13px;color:#637081}.stats b{color:#e99a00}.h1{font-weight:900;font-size:27px;margin:0 0 6px}.muted{color:#778396}.sub{margin:0 0 22px}.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 8px;justify-items:center;max-width:540px;margin:12px auto 30px}.unit{border:0;background:none;width:100%;display:flex;align-items:center;flex-direction:column;gap:8px;color:inherit;padding:6px;position:relative}.unit:nth-child(6n + 2){transform:translateY(16px)}.unit:nth-child(6n + 3){transform:translateY(30px)}.unit:nth-child(6n + 4){transform:translateY(30px)}.unit:nth-child(6n + 5){transform:translateY(16px)}.ring{--p:0;background:conic-gradient(#7bd20a calc(var(--p)*1%),#e0e5eb 0);border-radius:50%;padding:7px;width:min(26vw,124px);height:min(26vw,124px);box-shadow:0 5px 0 #d7dce5}.ring-in{height:100%;border:5px solid white;display:grid;place-items:center;background:#f3faff;border-radius:50%;font-size:46px}.unit strong{font-size:13px;line-height:1.25;text-align:center}.unit small{font-weight:800;color:#98a2af}.pill{background:#eef6df;color:#477a02;padding:7px 11px;border-radius:50px;font-weight:800;font-size:12px}.panel{background:white;border:2px solid #e8ecf1;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 4px 0 #e8ecf1}.btn{border:0;border-radius:14px;padding:14px 18px;background:#80ca12;color:white;font-weight:900;box-shadow:0 4px 0 #5b9d00}.btn.alt{background:#eff3f8;color:#394861;box-shadow:0 4px 0 #dce4eb}.btn.full{width:100%}.btn:active{transform:translateY(3px);box-shadow:none}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.gap{display:flex;gap:10px;flex-wrap:wrap}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:2px solid #edf0f3;padding:10px 10px max(12px,env(safe-area-inset-bottom))}.tabs button{width:min(33%,190px);padding:8px;color:#9aa5b4;background:none;border:none;font-weight:900}.tabs button.active{color:#67b800}.tabs .ico{display:block;font-size:24px}.small{font-size:13px}.card{max-width:540px;margin:18px auto;background:white;border:2px solid #e6ebef;border-radius:24px;padding:20px;box-shadow:0 6px 0 #e4eaf0;text-align:center;touch-action:pan-y;user-select:none;transition:transform .12s}.photo{width:100%;height:220px;object-fit:contain;border-radius:15px;background:#f0f4f8}.placeholder{height:220px;border:2px dashed #d6e0ea;border-radius:15px;display:grid;place-items:center;font-size:78px;background:#f8fafd}.word{font-size:28px;font-weight:900;margin:12px 0 5px}.es{color:#8693a4;margin:4px}.dot{border:0;border-radius:50%;width:27px;height:27px;vertical-align:middle;box-shadow:0 0 0 3px #f1f3f6}.dot.der{background:#3189e7}.dot.die{background:#f46e83}.dot.das{background:#38b68a}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px auto;max-width:550px}.option{background:white;border:2px solid #e1e7ef;border-bottom-width:5px;border-radius:16px;min-height:95px;padding:12px;font-weight:800}.option.good{border-color:#68c31c;background:#f0ffe6}.option.bad{border-color:#ee7474;background:#fff1f1}.option:disabled{opacity:1}.input{width:100%;border:2px solid #dfe5ed;padding:15px;border-radius:13px;margin:12px 0;font-size:20px}.file{display:block;background:#eef7ff;color:#3376a2;padding:12px;border-radius:13px;font-weight:900;margin:14px 0}.file input{display:none}.bar{height:10px;border-radius:20px;background:#e7ecf1;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#82c91e;border-radius:20px}.notice{padding:14px;background:#f1f7ff;border-radius:13px;color:#536681;font-size:13px}.reviewline{padding:12px 0;border-bottom:1px solid #e9edf2}.reviewline:last-child{border:0}.center{text-align:center}.back{background:transparent;border:0;font-weight:900;color:#728196;padding:7px 0 15px}.headline{font-size:20px;font-weight:900}.chip{display:inline-block;background:#f1f3f7;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800;color:#637083}.feedback{margin:12px auto;padding:13px;border-radius:14px;max-width:550px;background:#fff2de;font-weight:800}.empty{text-align:center;padding:55px 20px;color:#7c899a}.empty .emoji{font-size:56px}@media(min-width:800px){.path{gap:28px 45px}.app{padding-top:35px}.ring{width:138px;height:138px}.ring-in{font-size:55px}}@media(max-width:360px){.path{gap:15px 0}.ring{width:91px;height:91px}.ring-in{font-size:34px}}
</style></head>
<body><div id="app" class="app"></div><nav class="tabs"><button data-tab="learn" class="active"><span class="ico">🏠</span>Aprender</button><button data-tab="review"><span class="ico">🧠</span>Repasar</button><button data-tab="stats"><span class="ico">📊</span>Progreso</button></nav>
<script>
"use strict";
const THEMES=[
{id:"saludos",name:"Saludos",icon:"👋",words:[["hallo","hola","", "👋"],["danke","gracias","","🙏"],["bitte","por favor / de nada","","🙂"],["tschüss","adiós","","👋"],["guten Morgen","buenos días","","☀️"]]},
{id:"familia",name:"Familia",icon:"👨‍👩‍👧",words:[["Mutter","madre","die","👩"],["Vater","padre","der","👨"],["Kind","niño/a","das","🧒"],["Bruder","hermano","der","👦"],["Schwester","hermana","die","👧"]]},
{id:"casa",name:"Casa",icon:"🏡",words:[["Haus","casa","das","🏠"],["Wohnung","piso","die","🏢"],["Tür","puerta","die","🚪"],["Fenster","ventana","das","🪟"],["Schlüssel","llave","der","🗝️"]]},
{id:"cocina",name:"Cocina",icon:"🍳",words:[["Küche","cocina","die","🍳"],["Kühlschrank","nevera","der","🧊"],["Glas","vaso","das","🥛"],["Brot","pan","das","🍞"],["Milch","leche","die","🥛"]]},
{id:"comida",name:"Comida",icon:"🍎",words:[["Apfel","manzana","der","🍎"],["Banane","plátano","die","🍌"],["Ei","huevo","das","🥚"],["Fisch","pescado","der","🐟"],["Kartoffel","patata","die","🥔"]]},
{id:"ropa",name:"Ropa y compras",icon:"👕",words:[["Jacke","chaqueta","die","🧥"],["Schuh","zapato","der","👟"],["Kleidung","ropa","die","👕"],["Tasche","bolso","die","👜"],["Preis","precio","der","🏷️"]]},
{id:"transporte",name:"Transporte",icon:"🚆",words:[["Bahnhof","estación","der","🚉"],["Zug","tren","der","🚆"],["Bus","autobús","der","🚌"],["Fahrrad","bicicleta","das","🚲"],["Auto","coche","das","🚗"]]},
{id:"trabajo",name:"Trabajo",icon:"💼",words:[["Arbeit","trabajo","die","💼"],["Beruf","profesión","der","🧑‍💼"],["Chef","jefe","der","👔"],["Kollege","compañero","der","🤝"],["Firma","empresa","die","🏢"]]},
{id:"estudio",name:"Estudio",icon:"📚",words:[["Buch","libro","das","📖"],["Schule","escuela","die","🏫"],["Lehrer","profesor","der","👨‍🏫"],["Frage","pregunta","die","❓"],["Antwort","respuesta","die","💬"]]},
{id:"tiempo",name:"Tiempo y fechas",icon:"⏰",words:[["Tag","día","der","☀️"],["Woche","semana","die","📅"],["Monat","mes","der","🗓️"],["Jahr","año","das","🎉"],["Stunde","hora","die","🕒"]]},
{id:"naturaleza",name:"Naturaleza",icon:"🌳",words:[["Sonne","sol","die","☀️"],["Regen","lluvia","der","🌧️"],["Baum","árbol","der","🌳"],["Blume","flor","die","🌸"],["Hund","perro","der","🐕"]]},
{id:"ocio",name:"Ocio y deporte",icon:"⚽",words:[["Sport","deporte","der","🏅"],["Fußball","fútbol","der","⚽"],["Film","película","der","🎬"],["Musik","música","die","🎵"],["Hobby","afición","das","🎨"]]},
{id:"salud",name:"Salud",icon:"🩺",words:[["Arzt","médico","der","🩺"],["Kopf","cabeza","der","🧑"],["Hand","mano","die","✋"],["Arm","brazo","der","💪"],["Fieber","fiebre","das","🌡️"]]},
{id:"ciudad",name:"Ciudad",icon:"🏙️",words:[["Stadt","ciudad","die","🏙️"],["Straße","calle","die","🛣️"],["Hotel","hotel","das","🏨"],["Restaurant","restaurante","das","🍽️"],["Bank","banco","die","🏦"]]},
{id:"comunicacion",name:"Comunicación",icon:"📱",words:[["Telefon","teléfono","das","📱"],["Brief","carta","der","✉️"],["E-Mail","correo electrónico","die","📧"],["Adresse","dirección","die","📍"],["Internet","internet","das","🌐"]]},
{id:"verbos",name:"Verbos esenciales",icon:"🏃",words:[["lernen","aprender","","📚"],["sprechen","hablar","","🗣️"],["arbeiten","trabajar","","💼"],["gehen","ir / caminar","","🚶"],["essen","comer","","🍽️"]]}
];
const WORDS=THEMES.flatMap(t=>t.words.map((w,i)=>({id:t.id+"-"+i,theme:t.id,de:w[0],es:w[1],article:w[2],icon:w[3]})));
const DBNAME="flshd-deutsch-v1";let db;let page="learn",activeTheme=null,mode="cards",queue=[],idx=0,revealed=false,articleShown=false,answer=null,typed="",reviewMode=false,dragX=0;
let records={},photos={};
const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);const dayDiff=(a,b)=>Math.floor((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/86400000);
const addDays=(n)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function defaultRecord(){return {stage:0,known:false,learnedAt:null,lastSuccess:null,lastFailure:null,failures:[],streak:0,dueAt:null,intervalIndex:0,completed:false}}
function rec(id){return records[id]||(records[id]=defaultRecord())}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normalize(s){return String(s).normalize("NFC").trim().toLocaleLowerCase("de").replace(/\s+/g," ")}
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("records");d.createObjectStore("photos")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getAll(store){return new Promise(resolve=>{const tx=db.transaction(store,"readonly"),req=tx.objectStore(store).getAllKeys();req.onsuccess=()=>{const keys=req.result;const out={};if(!keys.length)return resolve(out);let n=0;keys.forEach(key=>{const q=tx.objectStore(store).get(key);q.onsuccess=()=>{out[key]=q.result;if(++n===keys.length)resolve(out)}})};req.onerror=()=>resolve({})})}
function put(store,id,val){return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function save(w){await put("records",w.id,rec(w.id));render()}
function failures7(w){return rec(w.id).failures.filter(d=>dayDiff(today(),d)<=6).length}
function mastered(w){return rec(w.id).completed}
function progress(t){const ws=WORDS.filter(w=>w.theme===t.id);return Math.round(ws.reduce((a,w)=>a+(rec(w.id).completed?3:Math.min(2,rec(w.id).stage)),0)/(ws.length*3)*100)}
function dueWords(){return WORDS.filter(w=>rec(w.id).completed&&rec(w.id).dueAt&&rec(w.id).dueAt<=today()).sort((a,b)=>{const ra=rec(a.id),rb=rec(b.id);const pa=(dayDiff(today(),ra.dueAt)*3)+failures7(a)*6;const pb=(dayDiff(today(),rb.dueAt)*3)+failures7(b)*6;return pb-pa})}
function setTab(p){page=p;activeTheme=null;render()}
function startTheme(id){activeTheme=id;reviewMode=false;mode="cards";queue=WORDS.filter(w=>w.theme===id&&rec(w.id).stage===0);if(!queue.length){mode="choice";queue=WORDS.filter(w=>w.theme===id&&rec(w.id).stage===1)}if(!queue.length){mode="type";queue=WORDS.filter(w=>w.theme===id&&rec(w.id).stage===2)}if(!queue.length){mode="done";queue=[]}idx=0;reset();render()}
function reset(){revealed=false;articleShown=false;answer=null;typed="";dragX=0}
function next(){idx++;reset();if(idx>=queue.length){if(!reviewMode&&mode!=="done"){const t=activeTheme;startTheme(t)}else{activeTheme=null;page="review";render()}}else render()}
function markFailure(w){const r=rec(w.id);r.known=false;r.lastFailure=today();r.failures.push(today());r.failures=r.failures.filter(d=>dayDiff(today(),d)<=35);r.streak=0;r.intervalIndex=0;if(r.completed){r.dueAt=addDays(1)}else{r.stage=0;r.dueAt=addDays(1)}}
function markSuccess(w,stage){const r=rec(w.id);r.known=true;r.lastSuccess=today();if(stage==="cards"){r.stage=Math.max(r.stage,1)}if(stage==="choice"){r.stage=Math.max(r.stage,2)}if(stage==="type"){r.stage=3;r.completed=true;r.learnedAt=today();r.streak=0;r.intervalIndex=0;r.dueAt=addDays(3)}}
function reviewSuccess(w){const r=rec(w.id);r.streak++;const intervals=[3,7,14,30,60,120,240];r.intervalIndex=Math.min(r.intervalIndex+1,intervals.length-1);r.dueAt=addDays(intervals[r.intervalIndex]);r.lastSuccess=today()}
function top(){const done=WORDS.filter(w=>mastered(w)).length;return '<header class="top"><div class="logo">FL<span>SH</span>D <span class="small">🇩🇪</span></div><div class="stats"><span>⭐ '+done+' / '+WORDS.length+'</span><span>🧠 '+dueWords().length+' pendientes</span></div></header>'}
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===page));let html=top();if(activeTheme){html+=renderSession()}else if(page==="learn"){html+='<h1 class="h1">Tu camino al alemán 🇩🇪</h1><p class="sub muted">Aprende con tus propias fotos. Avanza de arriba hacia abajo.</p><div class="path">'+THEMES.map(t=>'<button class="unit" data-theme="'+t.id+'"><span class="ring" style="--p:'+progress(t)+'"><span class="ring-in">'+t.icon+'</span></span><strong>'+esc(t.name)+'</strong><small>'+progress(t)+'%</small></button>').join("")+'</div>'}else if(page==="review"){const due=dueWords();html+='<h1 class="h1">Repasar 🧠</h1><p class="sub muted">Repasos más urgentes primero: retraso y fallos recientes.</p><div class="panel"><div class="headline">'+due.length+' palabras pendientes</div><p class="muted small">Intervalos tras acertar: 3 → 7 → 14 → 30 → 60 días. Si fallas: mañana.</p><button class="btn full" id="startReview" '+(!due.length?'disabled':'')+'>Empezar repaso</button></div>'+(!due.length?'<div class="empty"><div class="emoji">🌱</div>No tienes repasos pendientes. ¡Sigue aprendiendo!</div>':due.slice(0,20).map(w=>'<div class="reviewline row"><div><b>'+esc(w.article? w.article+" ":"")+esc(w.de)+'</b><div class="small muted">'+esc(w.es)+'</div></div><span class="chip">'+(failures7(w)?failures7(w)+" fallos / 7d":"Pendiente")+'</span></div>').join(""))}else{const done=WORDS.filter(w=>mastered(w)).length,known=WORDS.filter(w=>rec(w.id).known).length;html+='<h1 class="h1">Tu progreso 📊</h1><div class="panel"><div class="headline">'+done+' palabras aprendidas</div><p class="muted">'+known+' marcadas como conocidas · '+dueWords().length+' por repasar</p><div class="bar"><div style="width:'+Math.round(done/WORDS.length*100)+'%"></div></div><p class="small muted">Prototipo: '+WORDS.length+' palabras iniciales repartidas en '+THEMES.length+' temas. Los datos y fotos se guardan en este navegador.</p></div>'+THEMES.map(t=>'<div class="reviewline row"><span>'+t.icon+' '+esc(t.name)+'</span><b>'+progress(t)+'%</b></div>').join("")+'<div class="panel notice">Para conservar tus fotos, evita borrar los datos de este sitio. Esta versión no sincroniza entre dispositivos ni incluye cuentas.</div>'}
$("app").innerHTML=html;bind()}
function current(){return queue[idx]}
function image(w){return photos[w.id]?'<img class="photo" alt="Foto de '+esc(w.es)+'" src="'+photos[w.id]+'">':'<div class="placeholder" aria-label="Sin foto">'+w.icon+'</div>'}
function label(w,hidden=false){return w.article?'<button class="dot '+w.article+'" id="articleDot" title="Toca para revelar artículo" aria-label="Revelar artículo"></button> '+(articleShown?'<b>'+w.article+'</b> ':'')+(hidden?"":esc(w.de)):esc(w.de)}
function renderSession(){const t=THEMES.find(t=>t.id===activeTheme)||{name:"Repaso",icon:"🧠"};let h='<button class="back" id="goBack">← Volver</button><div class="row"><div><h1 class="h1">'+t.icon+' '+esc(t.name)+'</h1><span class="chip">'+(reviewMode?"Repaso":mode==="cards"?"1 · Descubrir":mode==="choice"?"2 · Reconocer":mode==="type"?"3 · Escribir":"Completado")+'</span></div><b class="muted">'+Math.min(idx+1,queue.length)+' / '+queue.length+'</b></div><div class="bar"><div style="width:'+(queue.length?idx/queue.length*100:100)+'%"></div></div>';
if(mode==="done")return h+'<div class="panel center"><div style="font-size:64px">🏆</div><h2>¡Tema completado!</h2><p>Ahora estas palabras seguirán apareciendo en la pestaña de repasos.</p><button class="btn" id="goHome">Volver a los temas</button></div>';
if(!queue.length)return h+'<div class="empty">No hay palabras pendientes.</div>';
const w=current();
if(mode==="cards"){h+='<div class="card" id="flipCard">'+image(w)+'<label class="file">📷 '+(photos[w.id]?"Cambiar foto":"Subir foto o hacer foto")+'<input id="upload" type="file" accept="image/*" capture="environment"></label><div class="small muted">Toca la tarjeta para '+(revealed?"ocultar":"revelar")+' la palabra</div><div class="word">'+(revealed?label(w):"¿Cómo se dice?")+'</div><p class="es">'+esc(w.es)+'</p></div><div class="center small muted">Desliza la tarjeta a la derecha si la sabes; izquierda si no.</div><div class="gap" style="justify-content:center;margin-top:18px"><button class="btn alt" id="miss">← No la sabía</button><button class="btn" id="know">La sabía →</button></div>';return h}
if(mode==="choice"){let opts=WORDS.filter(x=>x.id!==w.id&&x.theme===w.theme).slice();for(let i=opts.length-1;i>0;i--){let j=(idx*7+i*3)%(i+1);[opts[i],opts[j]]=[opts[j],opts[i]]}opts=[w,...opts.slice(0,3)];opts.sort((a,b)=>a.id.localeCompare(b.id));const shift=idx%4;opts=opts.slice(shift).concat(opts.slice(0,shift));h+='<div class="panel center"><div class="small muted">¿Cuál de estas palabras significa...?</div><div class="word">'+esc(w.es)+'</div></div><div class="options">'+opts.map(x=>'<button class="option '+(answer===x.id?(x.id===w.id?"good":"bad"):"")+'" data-choice="'+x.id+'" '+(answer?"disabled":"")+'>'+esc(x.article?x.article+" ":"")+esc(x.de)+'</button>').join("")+'</div>';if(answer){h+='<div class="feedback">'+(answer===w.id?"✅ ¡Correcto!":"❌ Era: "+esc(w.article? w.article+" ":"")+esc(w.de))+'</div><button class="btn full" id="continue">Continuar</button>'}return h}
if(mode==="type"||mode==="review"){h+='<div class="panel center"><div class="small muted">Escribe la palabra alemana correspondiente a esta imagen</div>'+image(w)+'<p class="es">'+esc(w.es)+'</p><input class="input" id="typeAnswer" placeholder="Escribe en alemán..." autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(typed)+'" '+(answer?"disabled":"")+'><p class="small muted">Ignoramos mayúsculas y minúsculas. Escribe el sustantivo sin artículo.</p></div>';if(answer){h+='<div class="feedback">'+(answer==="correct"?"✅ ¡Correcto!":"❌ Respuesta: "+esc(w.article?w.article+" ":"")+esc(w.de))+'</div><button class="btn full" id="continue">Continuar</button>'}else h+='<button class="btn full" id="checkAnswer">Comprobar</button>';return h}return h}
function bind(){document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>startTheme(b.dataset.theme));const r=$("startReview");if(r)r.onclick=()=>{queue=dueWords();idx=0;activeTheme="review";reviewMode=true;mode="review";reset();render()};const back=$("goBack");if(back)back.onclick=()=>{activeTheme=null;render()};const home=$("goHome");if(home)home.onclick=()=>{activeTheme=null;page="learn";render()};const w=current();if(!w||!activeTheme)return;
const dot=$("articleDot");if(dot)dot.onclick=e=>{e.stopPropagation();articleShown=!articleShown;render()};
const upload=$("upload");if(upload)upload.onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith("image/"))return alert("Selecciona una imagen");try{const url=await compress(file);photos[w.id]=url;await put("photos",w.id,url);render()}catch(e){alert("No se ha podido guardar la foto: "+e.message)}};
const flip=$("flipCard");if(flip){flip.onclick=e=>{if(e.target.closest("label")||e.target.closest("#articleDot"))return;revealed=!revealed;render()};let sx=0,sy=0;flip.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});flip.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();rating(dx>0)}},{passive:false})}
if($("know"))$("know").onclick=()=>rating(true);if($("miss"))$("miss").onclick=()=>rating(false);
document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=async()=>{if(answer)return;answer=b.dataset.choice;if(answer===w.id)markSuccess(w,"choice");else markFailure(w);await save(w)});
const inp=$("typeAnswer");if(inp){inp.oninput=e=>typed=e.target.value;inp.onkeydown=e=>{if(e.key==="Enter"&&!answer)check()}}
if($("checkAnswer"))$("checkAnswer").onclick=check;if($("continue"))$("continue").onclick=next}
async function rating(ok){const w=current();if(ok)markSuccess(w,"cards");else markFailure(w);await saveNoRender(w);next()}
async function saveNoRender(w){await put("records",w.id,rec(w.id))}
async function check(){const w=current();if(!normalize(typed))return;const ok=normalize(typed)===normalize(w.de);answer=ok?"correct":"wrong";if(ok){if(reviewMode)reviewSuccess(w);else markSuccess(w,"type")}else markFailure(w);await save(w)}
function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(reader.error);reader.onload=()=>{const im=new Image();im.onerror=()=>reject(Error("Imagen no válida"));im.onload=()=>{const canvas=document.createElement("canvas"),scale=Math.min(1,960/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext("2d").drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",0.78))};im.src=reader.result};reader.readAsDataURL(file)})}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
(async()=>{try{db=await dbOpen();[records,photos]=await Promise.all([getAll("records"),getAll("photos")]);render()}catch(e){$("app").innerHTML='<div class="panel"><h2>El almacenamiento no está disponible</h2><p>Activa el almacenamiento del navegador para guardar tus fotos y avances.</p><pre>'+esc(e.message)+'</pre></div>'}})();
</script></body></html>
